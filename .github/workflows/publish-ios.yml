name: Publish iOS metadata
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App Store version, e.g. 2.4.6'
        required: true
        type: string
      build:
        description: 'Build number, e.g. 2007260047'
        required: true
        type: string
      appstore_url:
        description: 'App Store URL (leave empty to keep current)'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: platform-release-manifest
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate and update iOS section
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          APPSTORE_URL: ${{ inputs.appstore_url }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD" =~ ^[0-9]+$ ]]
          if [[ -n "$APPSTORE_URL" ]]; then [[ "$APPSTORE_URL" == https://apps.apple.com/* ]]; fi
          ARGS=(--version "$VERSION" --build "$BUILD")
          if [[ -n "$APPSTORE_URL" ]]; then ARGS+=(--appstore "$APPSTORE_URL"); fi
          python3 scripts/update_ios.py "${ARGS[@]}"
          python3 scripts/generate_changelog.py
          python3 -m unittest discover -s tests -v
      - name: Commit iOS metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE.json CHANGELOG.md
          if git diff --cached --quiet; then echo 'No change'; exit 0; fi
          git commit -m "Update iOS to $VERSION ($BUILD)"
          git pull --rebase origin main
          git push origin HEAD:main
